[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-workspace-manager"
version = "0.1.0"
description = "Local lifecycle management for independent coding workspaces"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
 "pydantic>=2.9,<3",
 "uvicorn>=0.30,<1",
 "httpx>=0.27,<1",
 "watchfiles>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
workspace-manager = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
